aid: clivi
name: Clivi
description: Clivi is Mexico's largest digital clinic for diabetes and obesity care,
  delivering fully online telehealth treatment that combines endocrinologists, internists,
  nutritionists, and psychologists with continuous glucose monitoring and GLP-1 medications
  (Ozempic, Wegovy, Mounjaro, Saxenda, Rybelsus). Founded in 2020 and based in Mexico
  City, Clivi serves patients nationwide through WhatsApp-based virtual care, home
  medication delivery via its Farmacia Clivi digital pharmacy, and tiered treatment
  plans (Clivi Pro, Plus, Total, and Zero). Backed by 500 Global and other investors,
  Clivi operates as a consumer healthtech service; it publishes no public developer
  API, but does expose an llms.txt content index for AI agents.
